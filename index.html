<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRonk — POC</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0c1118; /* --ui-bg-0 (tokens em src/theme/tokens.ts) */
        /* Barlow Condensed EMBARCADA via @fontsource no main.ts (decisão
           2026-11-26, tema "placar esportivo BR" — substitui a Comic Sans do
           panfleto de 2026-11-16). Fallbacks condensados de sistema. */
        font-family: 'Barlow Condensed', 'Arial Narrow', 'Liberation Sans Narrow',
          'Helvetica Neue', sans-serif;
        font-weight: 500;
        color: #f2f5f8;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        /* O render interno é minúsculo; o upscale serrilhado é o visual do jogo. */
        image-rendering: pixelated;
      }
      /* Camada da HUD da run: o conteúdo e o estilo nascem em src/ui/hud.ts
         (mesmo padrão dos overlays). Aqui só a camada em si. */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #hud[hidden] {
        display: none;
      }
      /* Overlay de fim de run: só a CASCA aqui (ids são contrato do harness);
         o visual vive em src/ui/deathOverlay.ts, como nos demais overlays. */
      #death-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(8, 11, 17, 0.82);
        text-align: center;
      }
      #death-overlay[hidden] {
        display: none;
      }
      #menu-btn[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">carregando…</div>
    <div id="death-overlay" hidden>
      <h1>Fim de jogo</h1>
      <div id="death-stats"></div>
      <div class="death-actions">
        <!-- Rótulos do GDD/DECISIONS 2026-11-17; os ids são contrato do harness. -->
        <button id="restart-btn" type="button">Jogar de novo</button>
        <button id="menu-btn" type="button">Menu</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
